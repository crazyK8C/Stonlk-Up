services:
  db:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: stonk
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: stonk_up
    volumes:
      - stonk_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stonk -d stonk_up"]
      interval: 5s
      retries: 10
volumes:
  stonk_data:
